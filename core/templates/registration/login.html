{% extends 'base.html' %}

{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card glass">
        <h1 style="text-align: center; color: var(--primary);">Welcome Back</h1>
        <p class="text-muted" style="text-align: center; margin-bottom: 2rem;">Log into your LifeHub OS</p>
        
        {% if form.errors %}
            <div class="message error glass" style="font-size: 0.875rem;">
                Invalid username or password.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="text-muted" style="font-size: 0.875rem; display: block; margin-bottom: 0.5rem;">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label class="text-muted" style="font-size: 0.875rem; display: block; margin-bottom: 0.5rem;">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
        </form>

        <p style="text-align: center; margin-top: 2rem; font-size: 0.875rem;" class="text-muted">
            Don't have an account? <a href="{% url 'signup' %}" style="color: var(--primary); text-decoration: none;">Join LifeHub</a>
        </p>
    </div>
</div>
{% endblock %}
